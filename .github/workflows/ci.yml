name: Landing checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run format:check
      - name: Verify production container
        run: |
          docker build -t sheeplink-landing-check .
          docker run -d --name landing-check -p 127.0.0.1:3000:3000 -e PUBLIC_APP_URL=https://app.example.test sheeplink-landing-check
          trap 'docker rm -f landing-check' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/config.js | grep -q 'https://app.example.test'
          curl -fsS http://127.0.0.1:3000/privacidad | grep -q 'Política de privacidad'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q '<urlset'
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/no-existe)
          test "$code" = 404
